name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/yeonix
            echo "Pulling latest code from GitHub..."
            git pull origin main

            echo "Building frontend..."
            cd /home/ubuntu/yeonix/frontend
            npm install --silent
            npm run build
            chmod -R 755 dist

            echo "Updating backend dependencies..."
            cd /home/ubuntu/yeonix/backend
            npm install --omit=dev --silent
            pm2 reload yeonix-backend --update-env || pm2 restart yeonix-backend

            echo "Reloading ML service..."
            cd /home/ubuntu/yeonix/ml-service
            pm2 reload yeonix-ml || pm2 restart yeonix-ml

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Deployment to https://yeonix.duckdns.org completed successfully!"
